<style>

<body class="text-on-surface font-body-lg flex flex-col min-h-screen overflow-x-hidden antialiased">
<!-- Header (Focused View - Back button only) -->
<header class="flex items-center p-md bg-surface-container-lowest border-b border-border-subtle sticky top-0 z-10">
<button aria-label="Go back" class="p-xs mr-sm rounded hover:bg-surface-container-low transition-colors text-on-surface">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-on-surface flex-1">Settings</h1>
</header>
<main class="flex-1 p-margin-mobile flex flex-col gap-lg max-w-screen-md mx-auto w-full">
<!-- Profile Section -->
<section class="flex flex-col items-center gap-md mt-lg">
<div class="relative w-32 h-32 rounded-full overflow-hidden border border-border-subtle bg-surface-container">
<!-- Avatar placeholder -->
<div class="w-full h-full bg-surface-container-low flex items-center justify-center text-on-surface-variant bg-center bg-cover" data-alt="A stylized, minimalist avatar image suitable for a developer profile. It features abstract, geometric patterns resembling circuit boards or terminal prompts in a subtle dark mode color scheme. The overall aesthetic is highly technical, precise, and utilitarian, utilizing pitch-black backgrounds with subtle primary blue and slate gray accents." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCtJUT_CHGsTgtdWpp-o6_vt6siMPk_jf56fOgimh6_R-sRhKi_NqICibJKA3EHvyMEFeDrgZRbOZfOKlL3vlskPnab3FTheKR1EAgR2EYetAoZiiz5pFAPiO-HUia_phfyc-CH6d4nRZLTlvPKXFbs9tpOEUdBjvO1KofgWHPkKqJUSR5Xxd5PSnC7lRv_5QAYTVSE_G8G3tY25HQ8LYRS02ehU4t3e_ABohdG1h3RXJ9c8pJBFJVMCoSFT3x0V6fhKfNOYFHSz69T');">
</div>
<div class="absolute inset-0 ring-1 ring-inset ring-white/10 rounded-full"></div>
</div>
<h2 class="font-code-block text-syntax-blue text-lg">root@shellx</h2>
</section>
<!-- Configuration Section -->
<section class="bg-surface-container border border-border-subtle rounded-lg p-md flex flex-col gap-md">
<!-- IP Input -->
<div class="flex flex-col gap-sm">
<label class="font-label-caps text-on-surface-variant" for="server-ip">Public Server IP Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-outline-variant pointer-events-none" data-icon="dns">dns</span>
<input class="w-full bg-[#000000] border border-border-subtle rounded text-on-surface font-code-block p-sm pl-xl focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline-variant" id="server-ip" placeholder="192.168.1.1" type="text" value="203.0.113.42"/>
</div>
</div>
<!-- Additional mock settings for layout density -->
<div class="flex flex-col gap-sm">
<label class="font-label-caps text-on-surface-variant" for="ssh-port">SSH Port</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-outline-variant pointer-events-none" data-icon="lock">lock</span>
<input class="w-full bg-[#000000] border border-border-subtle rounded text-on-surface font-code-block p-sm pl-xl focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline-variant" id="ssh-port" placeholder="22" type="text" value="2222"/>
</div>
</div>
<!-- Save Action -->
<button class="mt-sm w-full bg-[#3B82F6] hover:bg-primary-container text-white font-label-caps py-sm px-md rounded transition-colors flex justify-center items-center gap-sm">
<span class="material-symbols-outlined" data-icon="save" style="font-size: 18px;">save</span>
                SAVE CONFIGURATION
            </button>
</section>
<!-- Status Signal -->
<section class="bg-surface-container border border-border-subtle rounded-lg p-sm flex items-center gap-sm mt-auto mb-lg">
<div class="w-2 h-2 rounded-full bg-tertiary pulse-animation mx-xs"></div>
<p class="font-code-block text-on-surface-variant text-sm flex-1">Pinging server...</p>
<span class="material-symbols-outlined text-outline-variant" data-icon="wifi_tethering" data-size="20px">wifi_tethering</span>
</section>
</main>
<script>
        // Simple interactivity for the save button
        document.querySelector('button.bg-\\[\\#3B82F6\\]').addEventListener('click', function(e) {
            const btn = e.currentTarget;
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = `<span class="material-symbols-outlined pulse-animation" data-icon="sync" style="font-size: 18px;">sync</span> SAVING...`;
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined" data-icon="check" style="font-size: 18px;">check</span> SAVED`;
                btn.classList.remove('opacity-80');
                btn.classList.remove('bg-[#3B82F6]');
                btn.classList.add('bg-secondary-container');
                
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.add('bg-[#3B82F6]');
                    btn.classList.remove('bg-secondary-container');
                }, 2000);
            }, 1000);
        });
    </script>

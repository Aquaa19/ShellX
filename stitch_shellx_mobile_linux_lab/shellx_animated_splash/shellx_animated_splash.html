<style>
        /* Level 0 Floor strict enforcement */
        body { background-color: #000000; }
        
        /* Subtle scanline atmospheric effect moving vertically */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
            pointer-events: none;
            animation: scrollScanlines 10s linear infinite;
        }

        @keyframes scrollScanlines {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        .pulse-glow {
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 5px rgba(173, 198, 255, 0.2); }
            100% { text-shadow: 0 0 20px rgba(173, 198, 255, 0.6); }
        }

        .blink {
            animation: blinker 1s steps(2, start) infinite;
        }

        @keyframes blinker {
            to { visibility: hidden; }
        }

        /* Staggered Fade In */
        .fade-in {
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards;
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.8s; }
        .delay-3 { animation-delay: 1.4s; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }

<body class="text-on-surface h-screen w-screen flex flex-col items-center justify-center overflow-hidden relative selection:bg-primary-container selection:text-on-primary-container">
<!-- Atmospheric Scanline Overlay -->
<div class="absolute inset-0 scanlines z-50"></div>
<!-- Main Splash Content -->
<main class="flex flex-col items-center justify-center z-10 w-full px-margin-mobile">
<!-- Logo Container -->
<div class="flex flex-col items-center justify-center mb-xl fade-in delay-1 pulse-glow">
<span class="font-headline-lg text-headline-lg text-primary-container tracking-tighter" style="transform: scale(2.5);">
                $<span class="blink">_</span>
</span>
</div>
<!-- Terminal Loading Progress -->
<div class="flex flex-col items-center mt-xl bg-surface-container border border-border-subtle rounded p-sm w-full max-w-[280px] fade-in delay-2">
<div class="font-code-block text-code-block text-syntax-green tracking-[0.2em] whitespace-pre w-full text-center" id="ascii-loader">
[                    ]
            </div>
</div>
</main>
<!-- Bottom Status Text -->
<footer class="absolute bottom-lg w-full flex justify-center z-10 fade-in delay-3">
<span class="font-label-caps text-label-caps text-surface-variant uppercase tracking-widest" id="boot-text">
</span>
</footer>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Loading Bar Logic
            const loaderElement = document.getElementById('ascii-loader');
            const totalSteps = 20;
            let currentStep = 0;
            
            // 3 seconds = 3000ms / 20 steps = 150ms per step
            const bootSequence = setInterval(() => {
                currentStep++;
                
                const equals = '='.repeat(currentStep);
                const arrow = currentStep < totalSteps ? '>' : '';
                const spaces = ' '.repeat(Math.max(0, totalSteps - currentStep));
                
                loaderElement.innerText = `[${equals}${arrow}${spaces}]`;
                
                if (currentStep >= totalSteps) {
                    clearInterval(bootSequence);
                    setTimeout(() => {
                        loaderElement.innerText = `[====================]`;
                    }, 150);
                }
            }, 150);

            // Typing Effect Logic for Footer
            const bootTextElement = document.getElementById('boot-text');
            const targetText = "Booting VM...";
            let charIndex = 0;

            // Delay start to match staggered fade-in (1.4s)
            setTimeout(() => {
                const typeInterval = setInterval(() => {
                    if (charIndex < targetText.length) {
                        bootTextElement.innerText += targetText.charAt(charIndex);
                        charIndex++;
                    } else {
                        clearInterval(typeInterval);
                    }
                }, 100); // Speed of typing
            }, 1400);
        });
    </script>

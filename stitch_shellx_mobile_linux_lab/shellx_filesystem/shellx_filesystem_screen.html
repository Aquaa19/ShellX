<!-- TopAppBar -->
<header class="bg-background dark:bg-background flex justify-between items-center w-full px-margin-mobile h-14 border-b border-border-subtle sticky top-0 z-50">

<h1 class="font-code-block text-headline-md font-bold text-primary dark:text-primary tracking-tight">ShellX_</h1>

<span class="material-symbols-outlined" data-icon="settings">settings</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow p-margin-mobile pb-32">
<div class="bg-surface-container-lowest border border-border-subtle rounded-lg p-sm font-code-block text-code-block">
<!-- Root -->
<div class="flex items-center gap-sm text-primary mb-xs">
<span class="material-symbols-outlined text-[18px]">folder_open</span>
<span class="">root@shellx: ~</span>
</div>
<!-- /bin -->
<div class="pl-md flex items-center gap-sm text-on-surface-variant hover:text-primary transition-colors cursor-pointer py-xs">
<span class="material-symbols-outlined text-[18px]">folder</span>
<span class="">bin</span>
</div>
<!-- /etc -->
<div class="pl-md flex items-center gap-sm text-on-surface-variant hover:text-primary transition-colors cursor-pointer py-xs">
<span class="material-symbols-outlined text-[18px]">folder</span>
<span class="">etc</span>
</div>
<!-- /home (Expanded) -->
<div class="pl-md">
<div class="flex items-center gap-sm text-primary py-xs">
<span class="material-symbols-outlined text-[18px]">folder_open</span>
<span class="">home</span>
</div>
<!-- /home/user (Expanded) -->
<div class="pl-md border-l border-border-subtle ml-xs">
<div class="flex items-center gap-sm text-primary py-xs pl-xs">
<span class="material-symbols-outlined text-[18px]">folder_open</span>
<span class="">user</span>
</div>
<!-- Files inside user -->
<div class="pl-md border-l border-border-subtle ml-xs flex flex-col gap-xs py-xs">

<div class="flex items-center gap-sm text-on-background bg-[#0D0D0D] border border-[#3B82F6] rounded pl-xs py-[2px] -ml-xs">
<span class="material-symbols-outlined text-[18px] text-syntax-blue">code</span>
<span class="">main.sh</span>
</div>
<!-- config.json -->
<div class="flex items-center gap-sm text-on-surface-variant hover:text-primary transition-colors cursor-pointer pl-xs py-[2px] -ml-xs">
<span class="material-symbols-outlined text-[18px] text-syntax-orange">code</span>
<span class="">config.json</span>
</div>
<!-- README.md -->
<div class="flex items-center gap-sm text-on-surface-variant hover:text-primary transition-colors cursor-pointer pl-xs py-[2px] -ml-xs">
<span class="material-symbols-outlined text-[18px]">description</span>
<span class="">README.md</span>
</div>
</div>
</div>

<body class="text-on-surface h-screen w-screen flex flex-col items-center justify-center overflow-hidden relative selection:bg-primary-container selection:text-on-primary-container">
<!-- Atmospheric Scanline Overlay -->
<div class="absolute inset-0 scanlines z-50"></div>
<!-- Main Splash Content -->

<!-- Logo Container -->

<span class="font-headline-lg text-headline-lg text-primary-container tracking-tighter" style="transform: scale(2.5);">$_</span>
</div>
<!-- Terminal Loading Progress -->
<div class="flex flex-col items-center mt-xl bg-surface-container border border-border-subtle rounded p-sm w-full max-w-[280px]">
<div class="font-code-block text-code-block text-syntax-green tracking-[0.2em] whitespace-pre w-full text-center" id="ascii-loader">
[&gt;                   ]
            </div>
</div>
</main>
<!-- Bottom Status Text -->
<footer class="absolute bottom-lg w-full flex justify-center z-10">
<span class="font-label-caps text-label-caps text-surface-variant uppercase tracking-widest">
            Booting VM...
        </span>
</footer>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const loaderElement = document.getElementById('ascii-loader');
            const totalSteps = 20;
            let currentStep = 0;

            const bootSequence = setInterval(() => {
                currentStep++;
                
                const equals = '='.repeat(currentStep);
                const arrow = currentStep < totalSteps ? '>' : '';
                const spaces = ' '.repeat(Math.max(0, totalSteps - currentStep));
                
                loaderElement.innerText = `[${equals}${arrow}${spaces}]`;
                
                // Color shift from primary to success/green towards the end
                if (currentStep > totalSteps * 0.7) {
                    loaderElement.classList.remove('text-primary');
                    loaderElement.classList.add('text-secondary');
                }

                if (currentStep >= totalSteps) {
                    clearInterval(bootSequence);
                    
                    // Final state stabilization
                    setTimeout(() => {
                        loaderElement.innerText = `[====================]`;
                        loaderElement.classList.remove('text-secondary');
                        loaderElement.classList.add('text-syntax-green');
                    }, 200);
                }
            }, 120); // Speed of loading bar
        });
    </script>

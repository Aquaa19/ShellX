<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ShellX - Authentication</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "on-tertiary-fixed": "#2a1700",

<style>
        body { background-color: #000000; } /* Strict pitch black as per spec Level 0 */
        .glass-terminal {
            background-color: #0D0D0D; /* Level 1 container */
            border: 1px solid #1F2937;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background min-h-screen flex items-center justify-center p-md antialiased overflow-hidden relative">
<!-- Subtle Background Elements (Atmospheric) -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20" style="background-image: radial-gradient(circle at 50% 50%, #1F2937 1px, transparent 1px); background-size: 32px 32px;"></div>
<div class="absolute top-0 right-0 w-96 h-96 bg-primary-container rounded-full mix-blend-screen filter blur-[100px] opacity-10 animate-pulse"></div>
<!-- Main Auth Canvas -->
<main class="w-full max-w-md z-10">
<!-- Terminal Header Simulation -->
<div class="glass-terminal rounded-t-DEFAULT border-b-0 p-sm flex items-center justify-between font-code-block text-code-block text-on-surface-variant">
<div class="flex items-center gap-xs">
<span class="w-2 h-2 rounded-full bg-error-red"></span>
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span class="w-2 h-2 rounded-full bg-secondary"></span>
</div>
<span>auth_session.sh</span>
<span class="material-symbols-outlined text-[16px]">lock</span>
</div>
<!-- Content Body -->
<div class="glass-terminal rounded-b-DEFAULT p-xl flex flex-col gap-lg">
<!-- Branding / Copy -->
<div class="text-center flex flex-col gap-sm items-center">
<div class="w-16 h-16 rounded-lg bg-surface-container-high border border-border-subtle flex items-center justify-center mb-md relative overflow-hidden group">
<span class="material-symbols-outlined text-[32px] text-primary group-hover:scale-110 transition-transform duration-300 z-10">terminal</span>
<div class="absolute inset-0 bg-primary opacity-0 group-hover:opacity-10 transition-opacity duration-300"></div>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Welcome to ShellX</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[280px]">Master the Linux command line with an integrated high-performance VM sandbox.</p>
</div>
<!-- Login Action -->
<div class="mt-md">
<button class="w-full flex items-center justify-center gap-sm p-md rounded-DEFAULT bg-surface-container border border-border-subtle hover:border-primary hover:bg-surface-container-high transition-colors duration-200 focus:outline-none focus:ring-1 focus:ring-primary group">
<!-- Google Icon SVG (Literal, as requested for "Sign in with Google", though using standard material icon as fallback if true SVG is preferred to be avoided, but standard is SVG) -->
<svg class="w-5 h-5 group-hover:scale-105 transition-transform duration-200" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label-caps text-label-caps text-on-surface">Sign in with Google</span>
</button>
</div>
<!-- Terminal Output Decorative -->
<div class="mt-lg border-t border-border-subtle pt-md">
<div class="font-code-block text-code-block text-[12px] text-outline-variant flex flex-col gap-1">
<p>~ $ init_secure_connection</p>
<p class="text-syntax-green">[OK] Sandboxed environment ready.</p>
<p class="text-syntax-orange">[WAIT] Awaiting user authentication...</p>
<div class="flex">
<span class="mr-2">~ $</span>
<span class="w-2 bg-on-surface-variant animate-pulse"></span>
</div>
</div>
</div>
</div>
</main>
<script>
        // Simple subtle entrance animation
        document.addEventListener('DOMContentLoaded', () => {
            const mainContainer = document.querySelector('main');
            mainContainer.style.opacity = '0';
            mainContainer.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                mainContainer.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
                mainContainer.style.opacity = '1';
                mainContainer.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spinner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    
    .loader {
      display: inline-block;
      text-align: center;
      line-height: 86px;
      position: relative;
      padding: 0 48px;
      font-size: 48px;
      font-family: 'JetBrains Mono', monospace;
      color: #4FDF94;
    }
    
    .loader:before, 
    .loader:after {
      content: "";
      display: block;
      width: 15px;
      height: 15px;
      background: #fff;
      position: absolute;
      animation: load .7s infinite alternate ease-in-out;
      top: 0;
    }
    
    .loader:after {
      top: auto;
      bottom: 0;
    }
    
    @keyframes load {
      0% {
        left: 0;
        height: 43px;
        width: 15px;
        transform: translateX(0);
      }
      50% {
        height: 10px;
        width: 40px;
      }
      100% {
        left: 100%;
        height: 43px;
        width: 15px;
        transform: translateX(-100%);
      }
    }
  </style>
</head>
<body>
  <span class="loader">ShellX</span>
</body>
</html>
